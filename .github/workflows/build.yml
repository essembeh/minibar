name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  UUID: minibar@essembeh.org

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev-bin zip

      - name: Syntax check
        run: |
          for f in src/*.js; do
            node --input-type=module --check < "$f"
            echo "$f OK"
          done

      - name: Build extension zip
        run: |
          glib-compile-schemas src/schemas/
          cd src
          zip -r "../$UUID.shell-extension.zip" \
            extension.js taskbar.js appButton.js notifications.js \
            windowPreview.js prefs.js metadata.json stylesheet.css schemas/

      - uses: actions/upload-artifact@v4
        with:
          name: minibar-shell-extension
          path: ${{ env.UUID }}.shell-extension.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minibar-shell-extension

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.UUID }}.shell-extension.zip
          generate_release_notes: true
